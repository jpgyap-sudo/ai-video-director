<!DOCTYPE html>
<html><head><title>Stanley preview reset</title></head>
<body style="font-family: system-ui; padding: 2rem; max-width: 32rem; margin: 0 auto;">
<h3>Clearing this origin&rsquo;s service workers and caches&hellip;</h3>
<p id="status">Working&hellip;</p>
<script>
(async () => {
  const lines = [];
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) await reg.unregister();
      lines.push(regs.length + ' service worker(s) unregistered.');
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      for (const key of keys) await caches.delete(key);
      lines.push(keys.length + ' cache(s) cleared.');
    }
    lines.push('Done. You can close this tab and reload the preview normally.');
  } catch (err) {
    lines.push('Error: ' + err);
  }
  document.getElementById('status').innerText = lines.join(' ');
})();
</script>
</body></html>
