[project]
name = "ai-video-director-api"
version = "0.1.0"
description = "AI Video Director API service"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.2.13",
    "alembic==1.14.0",
    "redis==5.2.1",
    "boto3==1.35.92",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.10.1",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.9.2",
    "mypy==1.14.1",
    "types-redis==4.6.0.20241004",
]

[project.scripts]
avd-export-openapi = "avd_api.scripts.export_openapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avd_api"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
