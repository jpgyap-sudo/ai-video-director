[project]
name = "ai-video-director-worker"
version = "0.1.0"
description = "AI Video Director Celery worker"
requires-python = ">=3.12"
dependencies = [
    "celery==5.4.0",
    "redis==5.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avd_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
